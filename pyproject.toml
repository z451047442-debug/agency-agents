[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agency_cli"]

[project]
name = "agency-agents"
version = "2.0.3"
description = "1406 AI agent personality definitions + quality toolkit for coding tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
agency = "agency_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pyyaml>=6.0",
    "ruff>=0.5",
    "mypy>=1.0",
    "jsonschema>=4.0",
    "bandit>=1.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["scripts"]
omit = [
    "scripts/_shared/__init__.py",
    # Historical one-off maintenance scripts (0% coverage, no longer modified)
    "scripts/upgrade*.py",
    "scripts/batch-second*.py",
    "scripts/batch-third*.py",
    "scripts/batch-methodology*.py",
    "scripts/b_agent_report.py",
    "scripts/debug_method_depth.py",
    "scripts/boost-actionability.py",
    "scripts/clean-boilerplate.py",
    "scripts/decentralize-deps.py",
    "scripts/enhance_deliverables.py",
    "scripts/fix_references.py",
    "scripts/fixup*.py",
    "scripts/improvement-plan.py",
    "scripts/add_methodology_framework*.py",
    "scripts/ab-test.py",
    "scripts/ab-evaluate.py",
    "scripts/target-fix.py",
    "scripts/check-contributor-ladder.py",
    "scripts/enhance-agents.py",
    "scripts/inject-safeguards.py",
]

[tool.coverage.report]
fail_under = 80
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"scripts/_shared/__init__.py" = ["F401"]
"scripts/batch-add-deps.py" = ["E701", "E702", "E741"]
"scripts/quality-report.py" = ["E402"]
"scripts/analyze-deps-auto.py" = ["B007"]
"scripts/i18n/check-i18n.py" = ["B007"]
"scripts/agent-lifecycle.py" = ["B007"]
"scripts/score-agents.py" = ["B007"]
"scripts/validate-index.py" = ["C401"]
# Historical maintenance scripts (no longer modified, excluded from coverage)
"scripts/ab-*.py" = ["E402"]
"scripts/add_methodology_framework*.py" = ["B007"]
"scripts/batch-methodology-framework.py" = ["F841"]
"scripts/batch-second-pass.py" = ["F841", "B007"]
"scripts/boost-actionability.py" = ["E701", "E702"]
"scripts/clean-boilerplate.py" = ["E701", "E702"]
"scripts/decentralize-deps.py" = ["B007"]
"scripts/fix_references.py" = ["F841"]
"scripts/fixup*.py" = ["B007"]
"scripts/upgrade*.py" = ["F841", "C401"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.bandit]
skips = ["B404", "B603", "B607", "B110", "B613"]
exclude_dirs = ["env", ".git", "integrations"]
