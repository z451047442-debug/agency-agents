name: Check Tools Consistency

# Triggered when tools.json, install/convert scripts, or this workflow change.
# New tool configurations are detected by the check-tools.sh script which
# validates against the canonical tools.json.
on:
  pull_request:
    paths:
      - 'tools.json'
      - 'scripts/check-tools.sh'
      - 'scripts/install.sh'
      - 'scripts/convert.*'
      - '.github/workflows/check-tools.yml'
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-tools:
    name: tools.json is the single source of truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Validate tool set
        run: |
          chmod +x scripts/check-tools.sh
          ./scripts/check-tools.sh
