name: Quality Gate

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/score-agents.py"
      - "scripts/lint-agents.py"
      - "scripts/analyze-deps.py"
      - "scripts/agent-lifecycle.py"
      - "scripts/shard-index.py"
      - "AGENTS.json"
      - ".github/workflows/quality-gate.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Quality scoring with tiered thresholds ──────────────────────────────
  # New agents (added files) must score ≥10 (B-grade).
  # Modified existing agents must score ≥8 (C-grade) and not regress.
  score:
    name: Score agents (new ≥10 / modified ≥8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install pyyaml

      - name: Get changed agent files (new vs modified)
        id: changed
        run: |
          NEW_FILES=$(git diff --name-only --diff-filter=A origin/${{ github.base_ref }}...HEAD -- '*.md' ':!examples/*' ':!integrations/*' ':!scripts/*' ':!docs/*' ':!.github/*')
          MOD_FILES=$(git diff --name-only --diff-filter=MCR origin/${{ github.base_ref }}...HEAD -- '*.md' ':!examples/*' ':!integrations/*' ':!scripts/*' ':!docs/*' ':!.github/*')
          {
            echo "new_files<<ENDOFLIST"
            echo "$NEW_FILES"
            echo "ENDOFLIST"
          } >> "$GITHUB_OUTPUT"
          {
            echo "mod_files<<ENDOFLIST"
            echo "$MOD_FILES"
            echo "ENDOFLIST"
          } >> "$GITHUB_OUTPUT"

      - name: Score NEW agents (v7 B-grade ≥10)
        if: steps.changed.outputs.new_files != ''
        env:
          NEW_FILES: ${{ steps.changed.outputs.new_files }}
        run: |
          FAILED=0
          for f in $NEW_FILES; do
            echo "::group::Scoring new agent: $f"
            python scripts/score-agents.py --file "$f" --no-freshness --threshold 10 || FAILED=1
            echo "::endgroup::"
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::New agents must score >=10 (v7 B-grade)."
            exit 1
          fi

      - name: Score MODIFIED agents (v7 C-grade ≥8)
        if: steps.changed.outputs.mod_files != ''
        env:
          MOD_FILES: ${{ steps.changed.outputs.mod_files }}
        run: |
          FAILED=0
          for f in $MOD_FILES; do
            echo "::group::Scoring modified: $f"
            python scripts/score-agents.py --file "$f" --no-freshness --threshold 8 || FAILED=1
            echo "::endgroup::"
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Modified agents must score >=8 (v7 C-grade)."
            exit 1
          fi

      - name: Safeguard check (advice-category agents must have disclaimers)
        run: |
          python scripts/score-agents.py --require-safeguards --no-freshness || {
            echo "::error::Professional-advice category agents missing safeguards section"
            exit 1
          }

      - name: Cross-dependency check for new agents
        if: steps.changed.outputs.new_files != ''
        env:
          NEW_FILES: ${{ steps.changed.outputs.new_files }}
        run: |
          for f in $NEW_FILES; do
            CROSS_DEPS=$(python -c "
          import yaml
          with open('$f') as fh:
              parts = fh.read().split('---', 2)
              if len(parts) >= 3:
                  fm = yaml.safe_load(parts[1]) or {}
                  deps = fm.get('depends_on', []) or []
                  cat = '$f'.split('/')[0]
                  cross = [d for d in deps if not d.startswith(cat)]
                  print(len(cross))
              else:
                  print(0)
          " 2>/dev/null || echo ERROR)
            if [ "$CROSS_DEPS" = "0" ]; then
              echo "::warning file=$f::New agent has no cross-category depends_on — consider linking to agents in other domains"
            elif [ "$CROSS_DEPS" = "ERROR" ]; then
              echo "::warning file=$f::Could not check cross-category deps (possible YAML parse error)"
            fi
          done

  # ── Security + lint on changed agents ───────────────────────────────────
  security-lint:
    name: Security scan & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install pyyaml bandit pip-audit

      - name: Get changed agent files
        id: changed
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD -- '*.md' ':!examples/*' ':!integrations/*' ':!scripts/*' ':!docs/*' ':!.github/*')
          {
            echo "files<<ENDOFLIST"
            echo "$FILES"
            echo "ENDOFLIST"
          } >> "$GITHUB_OUTPUT"

      - name: Lint with security scan
        if: steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          echo "::group::Lint + Security Scan"
          python scripts/lint-agents.py $CHANGED_FILES --no-freshness
          LINT_EXIT=$?
          echo "::endgroup::"

          echo "::group::SAST (bandit)"
          set -o pipefail
          python -m bandit -c pyproject.toml -r scripts/ -f txt -ll 2>&1 | tee bandit-report.txt
          BANDIT_EXIT=$?
          echo "::endgroup::"

          echo "::group::Dependency audit (pip-audit)"
          pip-audit --skip-editable 2>&1 || echo "::warning::Dependency vulnerabilities found — review and update affected packages"
          echo "::endgroup::"

          echo "::group::Security Lint Findings"
          python scripts/lint-agents.py $CHANGED_FILES --no-freshness 2>&1 | grep "SECURITY" || echo "No content security findings"
          echo "::endgroup::"

          if [ $LINT_EXIT -ne 0 ] || [ $BANDIT_EXIT -ne 0 ]; then
            exit 1
          fi

  # ── Dependency validation ──────────────────────────────────────────────
  validate-deps:
    name: Validate depends_on references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install pyyaml

      - name: Check for broken dependencies
        run: |
          python scripts/analyze-deps.py --validate
          echo "::notice::All depends_on references are valid"

      - name: Cross-category dependency coverage
        run: |
          python -c "
          import json, subprocess, sys
          result = subprocess.run([sys.executable, 'scripts/analyze-deps.py', '--report', '--json'],
                                  capture_output=True, text=True)
          data = json.loads(result.stdout)
          total = data['total_agents']
          with_deps = data['agents_with_deps']
          pct = (with_deps / total * 100) if total else 0
          print(f'Dependency coverage: {with_deps}/{total} agents ({pct:.1f}%)')
          if pct < 80:
              print(f'::warning::Low coverage ({pct:.0f}%) — cross-category connections recommended')
          "
          echo "::notice::Cross-category dependency check complete"

  # ── Index shard sync check ─────────────────────────────────────────────
  check-shards:
    name: Verify index shards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Check shards are in sync
        run: |
          if [ -d integrations/by-category ]; then
            python scripts/shard-index.py --check
          else
            echo "::notice::Shards not yet generated — run 'python scripts/shard-index.py' to create them"
          fi

  # ── Score regression check ─────────────────────────────────────────────
  score-regression:
    name: Score regression check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install pyyaml

      - name: Check for score regressions
        run: |
          # Fork PRs may not have the base branch available for checkout.
          # Fetch it explicitly; if unavailable, skip with a notice instead of failing.
          if ! git fetch origin "${{ github.base_ref }}" 2>/dev/null; then
            echo "::notice::Skipping score-regression step — could not fetch base branch '${{ github.base_ref }}' (fork PR without base ref)."
            exit 0
          fi
          git checkout -b base-scores FETCH_HEAD
          python scripts/score-agents.py --json --no-freshness > /tmp/base-scores.json
          git checkout -
          python scripts/score-agents.py --json --no-freshness > /tmp/pr-scores.json
          python -c "
          import json
          with open('/tmp/base-scores.json') as f: base = json.load(f)
          with open('/tmp/pr-scores.json') as f: pr = json.load(f)
          base_map = {a['id']: a for a in base['agents']}
          pr_map = {a['id']: a for a in pr['agents']}
          regressions = []
          for aid, a in pr_map.items():
              if aid in base_map:
                  delta = a['total'] - base_map[aid]['total']
                  if delta < 0:
                      regressions.append((aid, base_map[aid]['total'], a['total'], delta))
          if regressions:
              regressions.sort(key=lambda x: x[3])
              print(f'Score regressions detected ({len(regressions)} agents):')
              for aid, old, new, delta in regressions[:15]:
                  print(f'  {aid}: {old} -> {new} ({delta})')
              print(f'::error::{len(regressions)} agent(s) decreased in v7 score')
              import sys
              sys.exit(1)
          else:
              print('No score regressions detected')
          "

  # ── Quality summary ────────────────────────────────────────────────────
  summary:
    name: Quality Summary
    needs: [score, security-lint, validate-deps, check-shards, score-regression]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Overall status
        run: |
          echo "## Quality Gate Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.score.result }}" = "success" ]; then
            echo "| Score (v7 new>=10 / mod>=8) | ✅ PASS |" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.score.result }}" = "skipped" ]; then
            echo "| Score (v7 new>=10 / mod>=8) | ⏭️ SKIPPED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Score (v7 new>=10 / mod>=8) | ❌ FAIL |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.security-lint.result }}" = "success" ]; then
            echo "| Security + Lint | ✅ PASS |" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.security-lint.result }}" = "skipped" ]; then
            echo "| Security + Lint | ⏭️ SKIPPED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Security + Lint | ❌ FAIL |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.validate-deps.result }}" = "success" ]; then
            echo "| depends_on | ✅ PASS |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| depends_on | ❌ FAIL |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.check-shards.result }}" = "success" ]; then
            echo "| Index Shards | ✅ PASS |" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.check-shards.result }}" = "skipped" ]; then
            echo "| Index Shards | ⏭️ SKIPPED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Index Shards | ❌ FAIL |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.score-regression.result }}" = "success" ]; then
            echo "| Score Regression | ✅ PASS |" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.score-regression.result }}" = "skipped" ]; then
            echo "| Score Regression | ⏭️ SKIPPED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Score Regression | ❌ FAIL |" >> "$GITHUB_STEP_SUMMARY"
          fi
