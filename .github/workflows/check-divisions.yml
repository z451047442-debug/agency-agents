name: Check Divisions Consistency

# Triggered when divisions.json, check-divisions scripts, or this workflow change.
# New division directories are detected by the check-divisions.sh script which
# scans the filesystem directly.
on:
  pull_request:
    paths:
      - 'divisions.json'
      - 'scripts/check-divisions.*'
      - '.github/workflows/check-divisions.yml'
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-divisions:
    name: divisions.json is the single source of truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate division set
        run: |
          chmod +x scripts/check-divisions.sh
          ./scripts/check-divisions.sh
