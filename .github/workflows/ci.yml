name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install pyyaml jsonschema pytest-cov ruff

      - name: Lint Python
        run: python -m ruff check scripts/ --output-format=github

      - name: Validate agents (YAML + structure)
        run: python scripts/lint-agents.py --all --no-freshness

      - name: Validate depends_on
        run: python scripts/analyze-deps.py --validate

      - name: Validate AGENTS.json sync
        run: python scripts/validate-index.py

      - name: Run tests + coverage gate
        run: python -m pytest tests/ -q --tb=short --cov=scripts --cov-report=term

      - name: Verify install script can load
        run: bash scripts/install.sh --help

      - name: Verify docs are up to date
        run: python scripts/build-architecture.py --check

  extended:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install pyyaml mypy

      - name: Type check (mypy)
        run: python -m mypy scripts/ --ignore-missing-imports

      - name: Agent dedup check
        run: bash scripts/check-dupes.sh --threshold 0.85

      - name: i18n coverage check
        run: python scripts/i18n/check-i18n.py --strict

  score-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install pyyaml

      - name: Quality score gate (v7)
        run: python scripts/score-agents.py --threshold 8 --json

  cross-platform:
    name: "test (${{ matrix.os }}, py${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install pyyaml jsonschema pytest ruff

      - name: Lint Python
        run: python -m ruff check scripts/

      - name: Validate agents (YAML + structure)
        run: python scripts/lint-agents.py --all --no-freshness

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short

      - name: Verify encoding (UTF-8)
        run: python scripts/validate-index.py
