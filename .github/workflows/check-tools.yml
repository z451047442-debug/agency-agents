name: Check Tools Consistency

permissions:
  contents: read

# Triggered when tools.json, its schema, install/convert scripts, or this
# workflow change. New tool configurations are detected by check-tools.sh,
# which validates against the canonical tools.json.
on:
  pull_request:
    paths:
      - 'tools.json'
      - 'schemas/tools.schema.json'
      - 'scripts/check-tools.sh'
      - 'scripts/install.sh'
      - 'scripts/convert.*'
      - '.github/workflows/check-tools.yml'
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-tools:
    name: tools.json is the single source of truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install jsonschema
        run: pip install jsonschema==4.26.0

      - name: Validate tool set
        run: |
          chmod +x scripts/check-tools.sh
          ./scripts/check-tools.sh
