name: Nightly Full Audit

on:
  schedule:
    - cron: "37 2 * * *"  # nightly at 02:37 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Full Audit (Score + Duplicates + Dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate AGENTS.json index
        run: bash scripts/generate-index.sh

      - name: Quality scoring (v7)
        run: python scripts/score-agents.py --json

      - name: Duplicate detection
        run: bash scripts/check-dupes.sh --threshold 0.90

      - name: Dependency validation
        run: python scripts/analyze-deps.py --validate

  originality:
    name: Originality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Run originality check on changed agents
        run: bash scripts/check-agent-originality.sh

  auto-flag:
    name: Auto-Flag Agents for Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run auto-flag check
        run: |
          python scripts/agent-lifecycle.py --auto-flag --dry-run || echo "::warning::agent-lifecycle auto-flag failed (non-blocking)"
